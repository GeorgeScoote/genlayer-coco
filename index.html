<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenLayer Consensus Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/msgpack-lite@0.1.26/dist/msgpack.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%); }
        .gradient-text { background: linear-gradient(90deg, #ff6b35, #f7931e, #ffcc02); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: linear-gradient(145deg, #1a1a2e 0%, #16162a 100%); border: 1px solid rgba(255, 107, 53, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%); }
        .btn-primary:hover { background: linear-gradient(135deg, #ff8555 0%, #ffaa3e 100%); }
        .glow { box-shadow: 0 0 30px rgba(255, 107, 53, 0.2); }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen text-gray-100">
    <div id="toast" class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm transition-all transform translate-y-20 opacity-0"></div>

    <header class="sticky top-0 z-50 backdrop-blur-md border-b border-white/5">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-yellow-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-orange-500/20">G</div>
                <div>
                    <span class="font-bold text-lg gradient-text">Consensus</span>
                    <span class="text-xs text-gray-500 block -mt-1">Intelligent Game</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex flex-col items-end">
                    <span id="userXP" class="text-xs font-medium text-orange-400">0 XP</span>
                    <span id="userRank" class="text-[10px] text-gray-500">Rank -</span>
                </div>
                <div class="flex items-center gap-3 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
                    <div id="statusDot" class="w-1.5 h-1.5 rounded-full bg-red-500 pulse-dot"></div>
                    <button onclick="connectWallet()" id="walletBtn" class="text-sm font-medium hover:text-orange-400 transition-colors">
                        Connect Wallet
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="card rounded-2xl p-8 mb-8 relative overflow-hidden glow">
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-bold">New Challenge</h2>
                    <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10">
                        <span class="text-xs text-gray-400">Players</span>
                        <span id="playerCount" class="text-sm font-bold text-orange-400">0/5</span>
                    </div>
                </div>

                <div id="roomPlayers" class="flex flex-wrap gap-3 mb-8">
                    </div>

                <div class="space-y-4">
                    <div class="relative">
                        <input type="text" id="wordInput" placeholder="Enter secret word..." 
                               class="w-full bg-[#0a0a15] border border-white/10 rounded-xl px-5 py-4 text-lg focus:outline-none focus:border-orange-500/50 transition-colors">
                    </div>
                    <button onclick="submitWord()" id="submitBtn" 
                            class="w-full btn-primary py-4 rounded-xl font-bold text-lg shadow-lg transition-all active:scale-[0.98]">
                        Submit to Consensus
                    </button>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-2 space-y-4">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <span>📜</span> Game History
                </h3>
                <div id="historyList" class="space-y-3"></div>
            </div>
            <div class="space-y-4">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <span>🏆</span> Leaderboard
                </h3>
                <div id="leaderboardList" class="card rounded-xl p-4 space-y-3"></div>
            </div>
        </div>
    </main>

    <script>
        // ======= 你的配置 =======
        const CONTRACT_ADDRESS = '0xfa6048bC9db2f58D87007Ce2F120294fdF123845';
        let wallet = { connected: false, address: '' };

        // 1. 修改后的连接钱包逻辑 (增加了轮询)
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') return toast("Install MetaMask", "bg-red-500");
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                wallet.address = accounts[0];
                wallet.connected = true;
                
                document.getElementById('walletBtn').textContent = wallet.address.slice(0,6) + '...' + wallet.address.slice(-4);
                document.getElementById('statusDot').className = "w-1.5 h-1.5 rounded-full bg-green-500";
                
                // 【核心改进】：连接后每隔 3 秒自动刷一次数据，B 用户就能看到 A 了
                setInterval(fetchGameState, 3000);
                fetchGameState(); 
                toast("Connected!", "bg-green-500");
            } catch (e) {
                toast(e.message, "bg-red-500");
            }
        }

        // 2. 【核心改进】：获取游戏状态并实时显示玩家
        async function fetchGameState() {
            try {
                const response = await fetch('https://studio.genlayer.com/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: 1, method: 'gen_call',
                        params: [{
                            to: CONTRACT_ADDRESS,
                            data: encodeRead('get_game_status'),
                            type: 'read'
                        }]
                    })
                });
                const res = await response.json();
                if (!res.result) return;

                // 解析合约返回的玩家数据
                const roomData = JSON.parse(res.result);
                const players = Object.keys(roomData);
                
                // 更新 UI：人数和地址列表
                document.getElementById('playerCount').textContent = `${players.length}/5`;
                document.getElementById('roomPlayers').innerHTML = players.map(addr => `
                    <div class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs font-mono text-gray-400 flex items-center gap-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-orange-500"></div>
                        ${addr.slice(0,10)}...
                    </div>
                `).join('');

            } catch (e) { console.error("Sync error:", e); }
        }

        // 3. 提交逻辑 (保留你的原始发送方式)
        async function submitWord() {
            const word = document.getElementById('wordInput').value;
            if (!word) return toast("Enter a word", "bg-orange-500");
            
            try {
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('submitBtn').textContent = "Processing...";
                
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: wallet.address,
                        to: CONTRACT_ADDRESS,
                        data: '0x' + btoa(`submit_word:${word}`).split('').map(c=>c.charCodeAt(0).toString(16)).join('')
                    }]
                });
                
                toast("Submitted! Wait for consensus.", "bg-green-500");
                document.getElementById('wordInput').value = '';
            } catch (e) {
                toast("Transaction Failed", "bg-red-500");
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = "Submit to Consensus";
            }
        }

        // 简易编码
        function encodeRead(method) {
            return '0xda98' + Array.from(new TextEncoder().encode(`method|${method}\x00`)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        function toast(msg, cls) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm transition-all ${cls}`;
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }
    </script>
</body>
</html>
