<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenLayer Consensus Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%); }
        .gradient-text { background: linear-gradient(90deg, #ff6b35, #f7931e, #ffcc02); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: linear-gradient(145deg, #1a1a2e 0%, #16162a 100%); border: 1px solid rgba(255, 107, 53, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%); }
        .btn-primary:hover { background: linear-gradient(135deg, #ff8555 0%, #ffaa3e 100%); }
        .glow { box-shadow: 0 0 30px rgba(255, 107, 53, 0.2); }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="min-h-screen text-gray-100">
    <div id="toast" class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm transition-all transform translate-y-20 opacity-0"></div>

    <header class="sticky top-0 z-50 backdrop-blur-md border-b border-white/5">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-yellow-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-orange-500/20">G</div>
                <div>
                    <span class="font-bold text-lg gradient-text">Consensus</span>
                    <span class="text-xs text-gray-500 block -mt-1">GenLayer Game</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:flex flex-col items-end">
                    <span id="userXP" class="text-xs font-medium text-orange-400">0 XP</span>
                    <span id="userRank" class="text-[10px] text-gray-500">Rank -</span>
                </div>
                <button onclick="connectWallet()" id="walletBtn" class="bg-white/5 px-4 py-1.5 rounded-full border border-white/10 text-sm hover:text-orange-400">Connect Wallet</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="card rounded-2xl p-8 mb-8 glow">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold">Live Room</h2>
                <span id="playerCount" class="text-orange-400 font-bold">0/5 Players</span>
            </div>
            <div id="roomPlayers" class="flex flex-wrap gap-3 mb-8">
                </div>
            <div class="flex gap-4">
                <input type="text" id="wordInput" placeholder="Enter word..." class="flex-1 bg-black/40 border border-white/10 rounded-xl px-5 py-3 outline-none focus:border-orange-500">
                <button onclick="submitWord()" id="submitBtn" class="btn-primary px-8 py-3 rounded-xl font-bold">Submit</button>
            </div>
        </div>

        <div class="grid md:grid-cols-3 gap-8">
            <div class="md:col-span-2">
                <h3 class="font-bold mb-4 text-gray-400 flex items-center gap-2">📜 Game History</h3>
                <div id="historyList" class="space-y-4">
                    <p class="text-gray-600">No records found...</p>
                </div>
            </div>
            
            <div>
                <h3 class="font-bold mb-4 text-gray-400 flex items-center gap-2">🏆 Leaderboard</h3>
                <div id="leaderboardList" class="card rounded-xl p-4 space-y-3">
                    <p class="text-gray-600 text-center">Loading...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CONTRACT_ADDRESS = '0xfa6048bC9db2f58D87007Ce2F120294fdF123845';
        let wallet = { address: '', connected: false };

        async function connectWallet() {
            if (!window.ethereum) return toast("No Wallet", "bg-red-500");
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            wallet.address = accounts[0];
            wallet.connected = true;
            document.getElementById('walletBtn').textContent = wallet.address.slice(0,6)+'...'+wallet.address.slice(-4);
            
            // 启动全自动化同步
            setInterval(fetchAllData, 3000);
            fetchAllData();
            toast("Connected!", "bg-green-500");
        }

        // 统一刷新所有模块
        async function fetchAllData() {
            try {
                // 1. 刷新房间
                const roomRaw = await callRead('get_game_status');
                const room = JSON.parse(roomRaw || "{}");
                renderRoom(room);

                // 2. 刷新排行榜
                const boardRaw = await callRead('get_leaderboard');
                const board = JSON.parse(boardRaw || "{}");
                renderLeaderboard(board);

                // 3. 顺便模拟刷新一下历史记录
                renderHistory(room);
            } catch (e) { console.log("Syncing..."); }
        }

        function renderRoom(room) {
            const addrs = Object.keys(room);
            document.getElementById('playerCount').textContent = `${addrs.length}/5 Players`;
            document.getElementById('roomPlayers').innerHTML = addrs.map(a => `
                <div class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs font-mono">
                    ${a === wallet.address ? '⭐ You' : a.slice(0,10)}
                </div>
            `).join('');
        }

        function renderLeaderboard(board) {
            // 排序
            const sorted = Object.entries(board).sort((a,b) => b[1] - a[1]);
            
            // 更新当前用户的 XP
            if (wallet.address && board[wallet.address]) {
                document.getElementById('userXP').textContent = board[wallet.address] + " XP";
                const rank = sorted.findIndex(x => x[0] === wallet.address) + 1;
                document.getElementById('userRank').textContent = "Rank #" + rank;
            }

            document.getElementById('leaderboardList').innerHTML = sorted.map(([addr, xp], i) => `
                <div class="flex items-center justify-between text-sm">
                    <span class="text-gray-400">#${i+1} ${addr.slice(0,6)}</span>
                    <span class="text-orange-400 font-bold">${xp} XP</span>
                </div>
            `).join('') || '<p class="text-gray-600">Empty</p>';
        }

        function renderHistory(room) {
            // 这里简单模拟一下历史，你可以根据合约实际存储逻辑修改
            if (Object.keys(room).length === 0) {
                document.getElementById('historyList').innerHTML = `
                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                        <p class="text-sm text-gray-500">Waiting for a game to settle...</p>
                    </div>
                `;
            }
        }

        async function submitWord() {
            const word = document.getElementById('wordInput').value;
            if(!word || !wallet.connected) return toast("Check input/wallet", "bg-orange-500");
            
            try {
                document.getElementById('submitBtn').textContent = "Sending...";
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: wallet.address,
                        to: CONTRACT_ADDRESS,
                        data: '0x' + btoa(`submit_word:${word}`).split('').map(c=>c.charCodeAt(0).toString(16)).join('')
                    }]
                });
                toast("Success! Syncing...", "bg-green-500");
            } catch (e) { toast("Error", "bg-red-500"); }
            finally { document.getElementById('submitBtn').textContent = "Submit"; }
        }

        async function callRead(method) {
            const res = await fetch('https://studio.genlayer.com/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: '2.0', id: 1, method: 'gen_call',
                    params: [{ to: CONTRACT_ADDRESS, data: encodeRead(method), type: 'read' }]
                })
            });
            const json = await res.json();
            return json.result;
        }

        function encodeRead(m) { return '0xda98' + Array.from(new TextEncoder().encode(`method|${m}\x00`)).map(b => b.toString(16).padStart(2,'0')).join(''); }
        
        function toast(msg, cls) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = `fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm transition-all ${cls}`;
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }
    </script>
</body>
</html>
