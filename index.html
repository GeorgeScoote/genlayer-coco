<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenLayer Consensus Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f1a; color: white; }
        .card { background: #1a1a2e; border: 1px solid #ff6b3544; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .btn { background: linear-gradient(90deg, #ff6b35, #f7931e); padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .player-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-orange-500">🎮 5-Player Challenge</h1>
        
        <div class="card">
            <div class="flex justify-between mb-4">
                <span>Room Status</span>
                <span id="playerCount" class="text-orange-400 font-bold">0/5 Players</span>
            </div>
            <div id="playerList">
                <p class="text-gray-500 text-center">Waiting for players...</p>
            </div>
        </div>

        <div class="card">
            <input type="text" id="wordInput" placeholder="Enter word..." class="w-full p-3 mb-4 bg-gray-800 rounded border border-gray-700">
            <button onclick="submit()" id="subBtn" class="btn text-white">Submit to Chain</button>
            <p id="walletStatus" class="mt-4 text-xs text-center text-gray-500">Not Connected</p>
        </div>
    </div>

    <script>
        // 你提供的合约地址
        const CONTRACT_ADDRESS = '0xfa6048bC9db2f58D87007Ce2F120294fdF123845';
        let userAddr = '';

        // 1. 连接钱包并启动【自动刷新】
        async function connect() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddr = accounts[0];
                document.getElementById('walletStatus').textContent = "Connected: " + userAddr.slice(0,6) + "...";
                
                // 核心：启动轮询，每 3 秒自动找链要一次数据
                setInterval(updateUI, 3000);
                updateUI();
            } else {
                alert("Please install MetaMask");
            }
        }

        // 2. 【核心】自动更新逻辑：让 B 看到 A 的关键
        async function updateUI() {
            try {
                // 直接请求 GenLayer RPC
                const response = await fetch('https://studio.genlayer.com/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0', id: 1, method: 'gen_call',
                        params: [{
                            to: CONTRACT_ADDRESS,
                            data: encodeReadData('get_game_status'),
                            type: 'read'
                        }]
                    })
                });
                const res = await response.json();
                
                // 解析数据
                if (res.result) {
                    const roomData = JSON.parse(res.result);
                    const players = Object.keys(roomData);
                    
                    // 更新人数
                    document.getElementById('playerCount').textContent = `${players.length}/5 Players`;
                    
                    // 更新列表
                    if (players.length > 0) {
                        document.getElementById('playerList').innerHTML = players.map(addr => `
                            <div class="player-item">
                                <span class="text-sm font-mono">${addr.slice(0,12)}...</span>
                                <span class="text-orange-300">✓ Ready</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (e) {
                console.log("Syncing...");
            }
        }

        // 3. 提交单词
        async function submit() {
            const word = document.getElementById('wordInput').value;
            if(!word) return alert("Enter word");
            
            try {
                document.getElementById('subBtn').textContent = "Sending...";
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: userAddr,
                        to: CONTRACT_ADDRESS,
                        data: '0x' + btoa(`submit_word:${word}`).split('').map(c=>c.charCodeAt(0).toString(16)).join('') // 简易编码
                    }]
                });
                alert("Submitted! Wait a few seconds for sync.");
            } catch (e) {
                alert("Check your wallet/network");
            } finally {
                document.getElementById('subBtn').textContent = "Submit to Chain";
            }
        }

        // 简易编码函数（适配 GenLayer 读取）
        function encodeReadData(method) {
            return '0xda98' + Array.from(new TextEncoder().encode(`method|${method}\x00`))
                   .map(b => b.toString(16).padStart(2,'0')).join('');
        }

        window.onload = connect;
    </script>
</body>
</html>
